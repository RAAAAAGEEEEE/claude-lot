# Réglages de claude-lot. Emplacement : /etc/claude-lot.conf, ou le chemin donné par
# $CLAUDE_LOT_CONF ou --conf. Une ligne « clé=valeur » par réglage ; « # » commente.

# Plafond commun de tous les lots : aucun lancement à partir de ce pourcentage.
cinq_heures=85
semaine=90
# Plafond des lots lancés avec --prioritaire (travail qui ne doit pas attendre).
reserve=95
# rythme=1 : un lot ne démarre que sous la ligne régulière de la semaine (+ avance points).
rythme=0
avance=5

# Commande qui affiche « <% semaine> <% 5 h> <fin semaine epoch> <fin 5 h epoch> ».
sonde=~/.claude/skills/claude-lot/scripts/sonde-quota.sh
sonde_delai=120
# Sans aucune mesure utilisable : lancer (défaut) ou refuser.
mesure_impossible=lancer

journal=~/.local/state/claude-lot/journal.log
etat=~/.local/state/claude-lot/derniere-mesure
# Registre facultatif des identifiants de modèles : {"familles": {"opus": {"id": "..."}}}.
registre=~/.claude/modeles.json
commande=claude

# --- File de tâches (`claude-lot file`, voir docs/FILE.md) ---------------------------------
# Fichier de file : une ligne « tache[:modele[:effort]] » par tâche ; « # » commente.
file=~/.local/state/claude-lot/file.txt
# Nombre maximal de lancements par jour (jour local). Le vrai frein reste le quota.
file_max_par_jour=2
# Programme qui exécute UNE tâche. Reçoit : <tache> <modele ou auto> <effort ou vide> (et les variables
# CLAUDE_LOT_TACHE, CLAUDE_LOT_MODELE, CLAUDE_LOT_EFFORT, CLAUDE_LOT_MODELE_CHOISI, CLAUDE_LOT_EFFORT_CHOISI). Code 0 : fait ; 75 : limite d'usage,
# la tâche est remise en tête ; autre : échec, rangée dans « .fait » sans nouvel essai.
file_lanceur=~/.claude/skills/claude-lot/examples/lanceur-exemple.sh
# Contrôle facultatif en plus du quota (mémoire libre, incident en cours...). Reçoit le nom de la
# tâche ; code 0 : autorisé, autre : la file s'abstient (la dernière ligne affichée sert de raison).
file_garde=
# Durée maximale d'une tâche, en secondes (0 : aucune limite). Au-delà, son groupe de processus est arrêté.
file_delai=21600
# 1 : la file respecte toujours la ligne régulière de la semaine, même si rythme=0 plus haut.
file_rythme=1
# Sans mesure de quota : refuser (défaut pour la file, par prudence) ou lancer.
file_mesure_impossible=refuser
